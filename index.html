<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Splitter</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --ink: #1a1208;
    --paper: #fdf6e3;
    --paper2: #f5ead0;
    --receipt: #fffef9;
    --accent: #c8472a;
    --gold: #b8860b;
    --muted: #7a6a50;
    --border: #d4c4a0;
    --green: #2d6a4f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background-image: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 27px,
      rgba(180,160,120,0.08) 27px,
      rgba(180,160,120,0.08) 28px
    );
  }

  h1, h2, h3 { font-family: 'Playfair Display', serif; }

  .app-header {
    text-align: center;
    padding: 32px 20px 16px;
    border-bottom: 2px solid var(--border);
    background: var(--paper);
    position: relative;
  }
  .app-header::after {
    content: '✦ ✦ ✦';
    display: block;
    color: var(--gold);
    font-size: 11px;
    letter-spacing: 6px;
    margin-top: 6px;
  }
  .app-header h1 {
    font-size: 2.2rem;
    letter-spacing: -0.5px;
    color: var(--ink);
  }
  .app-header p {
    color: var(--muted);
    font-size: 0.82rem;
    font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .container {
    max-width: 1380px;
    margin: 0 auto;
    padding: 24px 24px 60px;
    display: grid;
    grid-template-columns: 260px 1fr 1fr;
    grid-template-rows: auto;
    gap: 20px;
    align-items: start;
  }

  .col-left {
    grid-column: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .col-middle {
    grid-column: 2;
  }

  .col-right {
    grid-column: 3;
    position: sticky;
    top: 16px;
  }

  @media (max-width: 1100px) {
    .container {
      grid-template-columns: 240px 1fr;
      max-width: 900px;
    }
    .col-right {
      grid-column: 1 / -1;
      position: static;
    }
  }

  @media (max-width: 700px) {
    .container { grid-template-columns: 1fr; padding: 16px 12px 60px; }
    .col-left, .col-middle, .col-right { grid-column: 1; }
    .col-right { position: static; }
  }

  .panel {
    background: var(--receipt);
    border: 1.5px solid var(--border);
    border-radius: 2px;
    padding: 20px;
    box-shadow: 3px 3px 0 rgba(180,160,120,0.2);
  }

  .panel-title {
    font-size: 0.72rem;
    font-family: 'DM Mono', monospace;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px dashed var(--border);
    padding-bottom: 8px;
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 0.75rem;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  input[type="text"], input[type="number"], input[type="date"], select {
    width: 100%;
    border: 1.5px solid var(--border);
    background: var(--paper);
    padding: 8px 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.88rem;
    color: var(--ink);
    border-radius: 2px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus, input[type="date"]:focus { border-color: var(--accent); }

  .row { margin-bottom: 12px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-radius: 2px;
    border: 1.5px solid;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .btn-primary:hover { background: var(--accent); border-color: var(--accent); }
  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border-color: var(--border);
  }
  .btn-secondary:hover { border-color: var(--ink); }
  .btn-danger {
    background: transparent;
    color: var(--accent);
    border-color: transparent;
    padding: 4px 8px;
  }
  .btn-danger:hover { border-color: var(--accent); }
  .btn-green {
    background: var(--green);
    color: white;
    border-color: var(--green);
    width: 100%;
    justify-content: center;
    padding: 12px;
    font-size: 0.82rem;
  }
  .btn-green:hover { opacity: 0.88; }

  /* Friends list */
  .friends-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .friend-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    background: var(--paper2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .friend-tag.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .friend-tag .remove { color: var(--accent); font-size: 1rem; line-height: 1; }

  /* Items table */
  .items-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 0.82rem; }
  .items-table th {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    border-bottom: 1.5px solid var(--border);
    padding: 4px 6px;
    text-align: left;
  }
  .items-table td { padding: 6px 6px; border-bottom: 1px dashed var(--border); vertical-align: top; }
  .items-table td:last-child { text-align: right; }

  .item-shared { font-size: 0.7rem; color: var(--muted); font-family: 'DM Mono', monospace; }

  /* Summary / Receipt panel */
  .receipt-panel {
    background: var(--receipt);
    border: 1.5px solid var(--border);
    border-radius: 2px;
    padding: 0;
    box-shadow: 3px 3px 0 rgba(180,160,120,0.2);
    overflow: hidden;
  }

  #receipt-export {
    padding: 28px 32px;
    font-family: 'DM Mono', monospace;
  }

  .receipt-header {
    text-align: center;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px dashed var(--border);
  }
  .receipt-header h2 { font-size: 1.5rem; }
  .receipt-header .restaurant-name {
    font-size: 1.1rem;
    font-family: 'Playfair Display', serif;
    color: var(--accent);
  }
  .receipt-header .meta { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }

  .person-receipt {
    margin-bottom: 16px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: var(--paper);
  }
  .person-receipt-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 6px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .person-receipt-name .total-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .person-receipt-name .total-amount {
    font-size: 1.2rem;
    color: var(--accent);
  }

  .line-item {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    padding: 2px 0;
    color: var(--ink);
  }
  .line-item.sub { color: var(--muted); font-size: 0.75rem; }
  .line-item.total-line {
    border-top: 1px solid var(--border);
    margin-top: 6px;
    padding-top: 6px;
    font-weight: 500;
    color: var(--ink);
  }

  .payment-section {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 2px dashed var(--border);
    text-align: center;
  }
  .payment-section h3 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .payment-detail {
    font-size: 0.9rem;
    color: var(--ink);
    margin: 4px 0;
  }

  .receipt-footer {
    text-align: center;
    margin-top: 16px;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .receipt-footer::before { content: '— '; }
  .receipt-footer::after { content: ' —'; }

  .actions-bar {
    display: flex;
    gap: 10px;
    padding: 16px 32px;
    border-top: 1.5px solid var(--border);
    background: var(--paper2);
    flex-wrap: wrap;
  }

  .grand-total-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 2px;
    margin-bottom: 16px;
  }
  .grand-total-bar span { font-family: 'DM Mono', monospace; font-size: 0.78rem; }
  .grand-total-bar strong { font-family: 'Playfair Display', serif; font-size: 1.2rem; }

  .inline-row { display: flex; gap: 8px; align-items: flex-end; }
  .inline-row > * { flex: 1; }
  .inline-row > .btn { flex: 0 0 auto; margin-bottom: 0; }

  .checkbox-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

  .cb-item input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    pointer-events: none;
  }
  .cb-item label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    cursor: pointer;
    padding: 5px 12px;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    background: var(--paper2);
    color: var(--ink);
    transition: background 0.12s, border-color 0.12s, color 0.12s;
    user-select: none;
    margin-bottom: 0;
  }
  .cb-item label .cb-box {
    width: 13px;
    height: 13px;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    background: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.12s, border-color 0.12s;
    font-size: 10px;
    color: transparent;
  }
  .cb-item input[type="checkbox"]:checked + label {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .cb-item input[type="checkbox"]:checked + label .cb-box {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .cb-item label:hover { border-color: var(--ink); }

  .empty-state {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
  }

  .tag { display: inline-block; background: var(--paper2); border: 1px solid var(--border); padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-family: 'DM Mono', monospace; color: var(--muted); }

  @media print { .actions-bar { display: none; } }
</style>
</head>
<body>

<div class="app-header">
  <div style="position:absolute;top:12px;right:16px;font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--muted);background:var(--paper2);border:1px solid var(--border);padding:2px 8px;border-radius:10px;letter-spacing:0.5px;">v1.0.2</div>
  <h1>Bill Splitter</h1>
  <p>Restaurant · Split · Share</p>
</div>

<div class="container">

  <!-- LEFT: Setup -->
  <div class="col-left">

    <!-- Restaurant Info -->
    <div class="panel">
      <div class="panel-title">Restaurant & Date</div>
      <div class="row">
        <label>Restaurant Name</label>
        <input type="text" id="restaurant-name" placeholder="e.g. Le Petit Bistro" oninput="updateReceipt()">
      </div>
      <div class="row">
        <label>Date</label>
        <input type="date" id="bill-date" oninput="updateReceipt()">
      </div>
    </div>

    <!-- Friends -->
    <div class="panel">
      <div class="panel-title">Friends</div>
      <div class="friends-list" id="friends-list"></div>
      <div class="inline-row">
        <div>
          <label>Add Name</label>
          <input type="text" id="new-friend" placeholder="e.g. Alice" onkeydown="if(event.key==='Enter')addFriend()">
        </div>
        <button class="btn btn-primary" onclick="addFriend()">+ Add</button>
      </div>
    </div>

    <!-- Charges -->
    <div class="panel">
      <div class="panel-title">Charges</div>
      <div class="row">
        <label>VAT (%)</label>
        <input type="number" id="vat" value="7" min="0" max="100" step="0.5" oninput="updateReceipt()">
      </div>
      <div class="row">
        <label>Service Charge (%)</label>
        <input type="number" id="service" value="10" min="0" max="100" step="0.5" oninput="updateReceipt()">
      </div>
    </div>

    <!-- Payment Info -->
    <div class="panel">
      <div class="panel-title">Payment Details</div>
      <div class="row">
        <label>Bank / App</label>
        <input type="text" id="pay-bank" placeholder="e.g. PromptPay / KBank" oninput="updateReceipt()">
      </div>
      <div class="row">
        <label>Account / Number</label>
        <input type="text" id="pay-account" placeholder="e.g. 0812345678" oninput="updateReceipt()">
      </div>
      <div class="row">
        <label>Name</label>
        <input type="text" id="pay-name" placeholder="e.g. John Doe" oninput="updateReceipt()">
      </div>
    </div>

  </div>

  <!-- MIDDLE: Add Items -->
  <div class="col-middle">
    <div class="panel">
      <div class="panel-title">Menu Items</div>

      <div class="row">
        <label>Item Name</label>
        <input type="text" id="item-name" placeholder="e.g. Pad Thai">
      </div>
      <div class="row">
        <label>Price</label>
        <input type="number" id="item-price" placeholder="0.00" min="0" step="0.01">
      </div>
      <div class="row">
        <label>Qty</label>
        <input type="number" id="item-qty" value="1" min="1">
      </div>

      <div class="row">
        <label>Shared By <span style="color:var(--accent);font-size:0.7rem;">(none selected = split all)</span></label>
        <div class="checkbox-row" id="item-friends-check"></div>
      </div>

      <div style="margin-top:4px; margin-bottom:16px;">
        <button class="btn btn-primary" onclick="addItem()" style="width:100%; justify-content:center;">+ Add Item</button>
      </div>

      <div class="panel-title">Items Added</div>
      <table class="items-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Price</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="items-body">
          <tr><td colspan="4" class="empty-state">No items yet</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- RIGHT: Receipt -->
  <div class="col-right">
    <div class="receipt-panel">
      <div id="receipt-export">
      <div class="receipt-header">
        <div class="restaurant-name" id="r-restaurant">Restaurant</div>
        <div class="meta" id="r-date"></div>
        <h2 style="margin-top:6px;">Bill Summary</h2>
      </div>
      <div id="r-people-list"><div class="empty-state">Add friends and items to see the split</div></div>
      <div id="r-payment" style="display:none;">
        <div class="payment-section">
          <h3>Payment To</h3>
          <div class="payment-detail" id="r-pay-bank"></div>
          <div class="payment-detail" id="r-pay-account"></div>
          <div class="payment-detail" id="r-pay-name"></div>
        </div>
      </div>
      <div class="receipt-footer">Thank you for dining together</div>
    </div>

    <div class="actions-bar">
      <button class="btn btn-primary" onclick="exportImage()">📷 Export as Image</button>
      <button class="btn btn-secondary" onclick="exportCSV()">📊 Export CSV (Google Sheets)</button>
      <button class="btn btn-secondary" onclick="window.print()">🖨 Print</button>
    </div>
    </div><!-- /receipt-panel -->
  </div><!-- /col-right -->

</div>

<script>
let friends = [];
let items = [];

// ---- Friends ----
function addFriend() {
  const input = document.getElementById('new-friend');
  const name = input.value.trim();
  if (!name || friends.includes(name)) return;
  friends.push(name);
  input.value = '';
  renderFriends();
  renderItemFriendsCheck();
  updateReceipt();
}

function removeFriend(name) {
  friends = friends.filter(f => f !== name);
  items.forEach(item => { item.sharedBy = item.sharedBy.filter(f => f !== name); });
  renderFriends();
  renderItemFriendsCheck();
  updateReceipt();
}

function renderFriends() {
  const el = document.getElementById('friends-list');
  if (friends.length === 0) { el.innerHTML = '<span style="font-family:DM Mono,monospace;font-size:0.78rem;color:var(--muted)">No friends added yet</span>'; return; }
  el.innerHTML = friends.map(f =>
    `<span class="friend-tag">${f}<span class="remove" onclick="removeFriend('${f}')">×</span></span>`
  ).join('');
}

function renderItemFriendsCheck() {
  const el = document.getElementById('item-friends-check');
  if (friends.length === 0) {
    el.innerHTML = '<span style="font-family:DM Mono,monospace;font-size:0.75rem;color:var(--muted)">Add friends first</span>';
    return;
  }
  el.innerHTML = friends.map((f, i) => {
    const id = 'cb_friend_' + i;
    return `<span class="cb-item">
      <input type="checkbox" id="${id}" value="${f}">
      <label for="${id}"><span class="cb-box">✓</span>${f}</label>
    </span>`;
  }).join('');
}

// ---- Items ----
function addItem() {
  const name = document.getElementById('item-name').value.trim();
  const price = parseFloat(document.getElementById('item-price').value);
  const qty = parseInt(document.getElementById('item-qty').value) || 1;
  if (!name || isNaN(price) || price <= 0) return;

  const checked = [...document.querySelectorAll('#item-friends-check input[type="checkbox"]:checked')].map(cb => cb.value);
  const sharedBy = checked.length > 0 ? checked : [...friends];

  items.push({ id: Date.now(), name, price, qty, sharedBy });
  document.getElementById('item-name').value = '';
  document.getElementById('item-price').value = '';
  document.getElementById('item-qty').value = '1';
  document.querySelectorAll('#item-friends-check input[type="checkbox"]').forEach(cb => cb.checked = false);

  renderItems();
  updateReceipt();
}

function removeItem(id) {
  items = items.filter(i => i.id !== id);
  renderItems();
  updateReceipt();
}

function renderItems() {
  const tbody = document.getElementById('items-body');
  if (items.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No items yet</td></tr>'; return; }
  tbody.innerHTML = items.map(item =>
    `<tr>
      <td>
        <div>${item.name}</div>
        <div class="item-shared">Shared: ${item.sharedBy.length > 0 ? item.sharedBy.join(', ') : 'everyone'}</div>
      </td>
      <td>${item.qty}</td>
      <td style="text-align:right;">${fmt(item.price * item.qty)}</td>
      <td style="text-align:right;"><button class="btn btn-danger" onclick="removeItem(${item.id})">×</button></td>
    </tr>`
  ).join('');
}

// ---- Receipt ----
function fmt(n) { return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function updateReceipt() {
  const vatPct = parseFloat(document.getElementById('vat').value) || 0;
  const svcPct = parseFloat(document.getElementById('service').value) || 0;
  const restaurant = document.getElementById('restaurant-name').value || 'Restaurant';
  const rawDate = document.getElementById('bill-date').value;
  let date = '';
  if (rawDate) {
    const d = new Date(rawDate + 'T00:00:00');
    date = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  const bank = document.getElementById('pay-bank').value;
  const account = document.getElementById('pay-account').value;
  const payName = document.getElementById('pay-name').value;

  document.getElementById('r-restaurant').textContent = restaurant;
  document.getElementById('r-date').textContent = date;

  // Payment
  const hasPayment = bank || account || payName;
  const payEl = document.getElementById('r-payment');
  if (hasPayment) {
    payEl.style.display = 'block';
    document.getElementById('r-pay-bank').textContent = bank ? `💳 ${bank}` : '';
    document.getElementById('r-pay-account').textContent = account ? `# ${account}` : '';
    document.getElementById('r-pay-name').textContent = payName ? `👤 ${payName}` : '';
  } else {
    payEl.style.display = 'none';
  }

  const el = document.getElementById('r-people-list');

  if (friends.length === 0 || items.length === 0) {
    el.innerHTML = '<div class="empty-state">Add friends and items to see the split</div>';
    return;
  }

  // Compute per-person subtotals
  const subtotals = {};
  friends.forEach(f => subtotals[f] = { items: [], subtotal: 0 });

  items.forEach(item => {
    const share = item.sharedBy.length > 0 ? item.sharedBy : friends;
    const perPerson = (item.price * item.qty) / share.length;
    share.forEach(f => {
      if (subtotals[f]) {
        subtotals[f].items.push({ name: item.name, qty: item.qty, perPerson, sharedWith: share.length });
        subtotals[f].subtotal += perPerson;
      }
    });
  });

  let grandTotal = 0;
  const html = friends.map(f => {
    const data = subtotals[f];
    const sub = data.subtotal;
    const svc = sub * svcPct / 100;
    const vat = (sub + svc) * vatPct / 100;
    const total = sub + svc + vat;
    grandTotal += total;

    const itemLines = data.items.map(i =>
      `<div class="line-item">
        <span>${i.name}${i.sharedWith > 1 ? ` <span class="tag">÷${i.sharedWith}</span>` : ''}</span>
        <span>${fmt(i.perPerson)}</span>
      </div>`
    ).join('');

    return `<div class="person-receipt">
      <div class="person-receipt-name">
        <span>${f}</span>
        <span><span class="total-label">Total </span><span class="total-amount">${fmt(total)}</span></span>
      </div>
      ${itemLines}
      <div class="line-item sub"><span>Subtotal</span><span>${fmt(sub)}</span></div>
      ${svcPct > 0 ? `<div class="line-item sub"><span>Service (${svcPct}%)</span><span>${fmt(svc)}</span></div>` : ''}
      ${vatPct > 0 ? `<div class="line-item sub"><span>VAT (${vatPct}%) on ${fmt(sub + svc)}</span><span>${fmt(vat)}</span></div>` : ''}
      <div class="line-item total-line"><span>Pay</span><span><strong>${fmt(total)}</strong></span></div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="grand-total-bar">
      <span>Grand Total (${friends.length} people)</span>
      <strong>${fmt(grandTotal)}</strong>
    </div>
    ${html}
  `;
}

// ---- Export ----
async function exportImage() {
  const el = document.getElementById('receipt-export');
  const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#fffef9', useCORS: true });
  const link = document.createElement('a');
  link.download = 'bill-split.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function exportCSV() {
  const vatPct = parseFloat(document.getElementById('vat').value) || 0;
  const svcPct = parseFloat(document.getElementById('service').value) || 0;
  const restaurant = document.getElementById('restaurant-name').value || 'Restaurant';
  const rawDate = document.getElementById('bill-date').value;
  const date = rawDate ? new Date(rawDate + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '';

  let csv = `Bill Split - ${restaurant} - ${date}\n\n`;
  csv += `Name,Item,Qty,Shared With,Per Person,Subtotal,VAT (${vatPct}%),Service (${svcPct}%),Total\n`;

  friends.forEach(f => {
    const itemsForF = [];
    let sub = 0;
    items.forEach(item => {
      const share = item.sharedBy.length > 0 ? item.sharedBy : friends;
      if (share.includes(f)) {
        const pp = (item.price * item.qty) / share.length;
        itemsForF.push({ name: item.name, qty: item.qty, pp, shared: share.length });
        sub += pp;
      }
    });
    const svc = sub * svcPct / 100;
    const vat = (sub + svc) * vatPct / 100;
    const total = sub + svc + vat;

    if (itemsForF.length === 0) {
      csv += `${f},,,,${sub.toFixed(2)},${vat.toFixed(2)},${svc.toFixed(2)},${total.toFixed(2)}\n`;
    } else {
      itemsForF.forEach((item, i) => {
        if (i === 0) {
          csv += `${f},"${item.name}",${item.qty},÷${item.shared},${item.pp.toFixed(2)},${sub.toFixed(2)},${vat.toFixed(2)},${svc.toFixed(2)},${total.toFixed(2)}\n`;
        } else {
          csv += `,"${item.name}",${item.qty},÷${item.shared},${item.pp.toFixed(2)},,,,\n`;
        }
      });
    }
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const link = document.createElement('a');
  link.download = 'bill-split.csv';
  link.href = URL.createObjectURL(blob);
  link.click();
}
